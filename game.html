<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div id="div">
            <button id="startBtn">Start Game</button>
            <button id="runBtn">Run</button>
            <h4 id="score">Score: 0</h4>
            <div id="flex-container">
                <div id="userContainer">
                    <div id="user"></div>
                </div>
                <div id="container">
                    <div id="bullet"></div>
                </div>
            </div>
        </div>
        <div id="rightDock">
            <div id="drawPanel">
                <canvas id="c"></canvas>
            </div>
            <div id="symbols-page">
                <div id="symbols-grid">
                    <button class="symbol-btn" data-shape="square" data-polarity="positive">square red</button>
                    <button class="symbol-btn" data-shape="square" data-polarity="negative">square blue</button>
                    <button class="symbol-btn" data-shape="diamond" data-polarity="positive">diamond red</button>
                    <button class="symbol-btn" data-shape="diamond" data-polarity="negative">diamond blue</button>
                    <button class="symbol-btn" data-shape="circle" data-polarity="positive">circle red</button>
                    <button class="symbol-btn" data-shape="circle" data-polarity="negative">circle blue</button>
                </div>

                <button class="symbol-btn" id="clean">clean</button>
                <button class="symbol-btn" id="run">run</button>
            </div>
        </div>
    </div>
    <script type="module" src="js/right.js"></script>
    <script type="module" src="js/script.js"></script>
</body>

</html>
