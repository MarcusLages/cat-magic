<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3 Layers - Per-layer color + Glow + Outer on top</title>
  <link rel="stylesheet" href="css/right.css" />
</head>
<body>
  <div id="app">
    <div id="rightDock">
      <div id="drawPanel">
        <canvas id="c"></canvas>
      </div>

      <div id="uiRight">
        <div class="panel">
          <div class="row">
            <button class="btnSmall" id="clearShape">Clear</button>
            <button class="btnSmall" id="runBtn" type="button">Run</button>
          </div>
        </div>

        <div class="panel">
          <div class="row" style="margin-bottom:10px;">
            <div class="segmented">
              <button id="polPositive" class="active" type="button">Positive (Red)</button>
              <button id="polNegative" type="button">Negative (Blue)</button>
            </div>
          </div>
        </div>

        <div class="panel" id="layersPanel">
          <div class="layerCard active" data-layer="1" id="layerCard1">
            <div class="layerTitle">
              <strong>Layer 1 (Outer)</strong>
              <span id="layerSummary1" class="pill">Not set</span>
            </div>
            <div class="confirmRow">
              <button class="btnWide" id="confirm1">Confirm Layer 1</button>
              <span id="lock1" class="lockBadge">Unlocked</span>
            </div>
          </div>

          <div class="layerCard" data-layer="2" id="layerCard2">
            <div class="layerTitle">
              <strong>Layer 2 (Middle)</strong>
              <span id="layerSummary2" class="pill">Not set</span>
            </div>
            <div class="confirmRow">
              <button class="btnWide" id="confirm2" disabled>Confirm Layer 2</button>
              <span id="lock2" class="lockBadge">Locked</span>
            </div>
          </div>

          <div class="layerCard" data-layer="3" id="layerCard3">
            <div class="layerTitle">
              <strong>Layer 3 (Inner)</strong>
              <span id="layerSummary3" class="pill">Not set</span>
            </div>
            <div class="confirmRow">
              <button class="btnWide" id="confirm3" disabled>Confirm Layer 3</button>
              <span id="lock3" class="lockBadge">Locked</span>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="row" style="margin-bottom:10px;">
            <span class="pill" id="editStatus">Editing: Layer 1</span>
            <span class="pill" id="previewStatus">Preview: Circle (index 6)</span>
          </div>

          <div class="row" style="margin-bottom:10px;">
            <div class="segmented">
              <button id="shapeCircle" class="active" type="button">Circle</button>
              <button id="shapeSquare" type="button">Square</button>
              <button id="shapeDiamond" type="button">Diamond</button>
            </div>
          </div>

          <div class="row">
            <input id="idxBar" type="range" min="0" max="3999" step="1" value="6" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/right.js"></script>
</body>
</html>
