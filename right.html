<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layers: L-Border Square + Inner Circle Toggle</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { display: block; background: #111; }

    #uiLeft, #uiRight {
      position: fixed;
      top: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 10;
      font: 14px system-ui;
      color: white;
    }
    #uiLeft { left: 12px; }
    #uiRight {
      right: 12px;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    button {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #1b1b1b;
      color: white;
      cursor: pointer;
      min-width: 44px;
    }
    button:hover { background: #242424; }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #444;
      background: #1b1b1b;
      user-select: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="uiLeft">
    <button id="toggleMirror">Mirroring: ON</button>
    <span id="mirrorStatus" class="pill">Drawing 4 quadrants</span>
  </div>

  <div id="uiRight">
    <div class="row">
      <button id="minusRoman">−</button>
      <span id="romanStatus" class="pill">Inner: 6 (VI)</span>
      <button id="plusRoman">+</button>
    </div>

    <div class="row">
      <button id="minusSquare">−</button>
      <span id="squareStatus" class="pill">Square: 0 / 10</span>
      <button id="plusSquare">+</button>
    </div>
  </div>

  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    const toggleMirrorBtn = document.getElementById("toggleMirror");
    const mirrorStatusEl = document.getElementById("mirrorStatus");

    const minusRomanBtn = document.getElementById("minusRoman");
    const plusRomanBtn  = document.getElementById("plusRoman");
    const romanStatusEl = document.getElementById("romanStatus");

    const minusSquareBtn = document.getElementById("minusSquare");
    const plusSquareBtn  = document.getElementById("plusSquare");
    const squareStatusEl = document.getElementById("squareStatus");

    let mirroringOn = true;

    // Layer 1 (inner circle only; outer circle constant)
    let value = 6; // allow 0+

    // Layer 2
    let squareLevel = 0; // 0..10

    const mirrors = [
      [ 1,  1],
      [-1,  1],
      [ 1, -1],
      [-1, -1],
    ];

    function toRoman(n) {
      if (!Number.isFinite(n) || n <= 0 || n >= 4000) return "";
      const map = [
        [1000, "M"], [900, "CM"], [500, "D"], [400, "CD"],
        [100, "C"], [90, "XC"], [50, "L"], [40, "XL"],
        [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"],
      ];
      let out = "";
      for (const [num, sym] of map) while (n >= num) { out += sym; n -= num; }
      return out;
    }

    function updateRomanUI() {
      romanStatusEl.textContent = (value === 0)
        ? "Inner: 0 (—)"
        : `Inner: ${value} (${toRoman(value)})`;
      draw();
    }

    function updateSquareUI() {
      squareStatusEl.textContent = `Square: ${squareLevel} / 10`;
      draw();
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      draw();
    }

    function drawQuadrantLines(midX, midY) {
      ctx.strokeStyle = "white";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(midX, 0); ctx.lineTo(midX, canvas.height);
      ctx.moveTo(0, midY); ctx.lineTo(canvas.width, midY);
      ctx.stroke();
    }

    function strokeArc(r, lineWidth, color, start, end) {
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(0, 0, r, start, end);
      ctx.stroke();
    }

    function eraseCircle(x, y, radius) {
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawHollowMarker(x, y, outerRadius, strokeWidth, color) {
      ctx.save();
      ctx.globalCompositeOperation = "source-over";
      ctx.strokeStyle = color;
      ctx.lineWidth = strokeWidth;
      ctx.beginPath();
      ctx.arc(x, y, outerRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawText(text, x, y, sizePx, color) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = `${sizePx}px system-ui`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    // ---------- LAYER 2 rules ----------
    // 0: empty
    // 1-5: 1..5 border lines
    // 6-9: (level-5) border lines + V
    // 10: 1 border line + X
    function borderCountForLevel(level) {
      if (level <= 0) return 0;
      if (level >= 1 && level <= 5) return level;
      if (level >= 6 && level <= 9) return level - 5;
      if (level === 10) return 1;
      return 0;
    }
    function markForLevel(level) {
      if (level >= 6 && level <= 9) return "V";
      if (level === 10) return "X";
      return null;
    }

    // Draw ONLY top+right borders (L-shape), with N parallel lines
    function drawLBorder(half, count) {
      if (count <= 0) return;

      const spacing = 8;
      const lw = 3;

      ctx.strokeStyle = "red";
      ctx.lineWidth = lw;
      ctx.lineCap = "butt";

      for (let i = 0; i < count; i++) {
        const inset = i * spacing;

        const x0 = 0 + inset;
        const y0 = -half + inset;
        const x1 = half - inset;
        const y1 = 0 - inset;

        if (x0 >= x1 - 2 || y0 >= y1 - 2) break;

        // top
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y0);
        ctx.stroke();

        // right
        ctx.beginPath();
        ctx.moveTo(x1, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
      }
    }

    // Straight V/X placed more towards center + smaller
    function drawMarkNearCorner(half, type) {
      const lw = 3;
      ctx.strokeStyle = "red";
      ctx.lineWidth = lw;
      ctx.lineCap = "butt";

      // More towards center (bigger pad)
      const pad = 52; // was 40
      const cx = half - pad;
      const cy = -half + pad;

      // Smaller mark size
      const s = 12; // was 16

      if (type === "V") {
        ctx.beginPath();
        ctx.moveTo(cx - s, cy - s);
        ctx.lineTo(cx,     cy + s);
        ctx.lineTo(cx + s, cy - s);
        ctx.stroke();
      } else if (type === "X") {
        ctx.beginPath();
        ctx.moveTo(cx - s, cy - s);
        ctx.lineTo(cx + s, cy + s);
        ctx.moveTo(cx - s, cy + s);
        ctx.lineTo(cx + s, cy - s);
        ctx.stroke();
      }
    }

    // =========================
    // LAYER 2 (UNDER LAYER 1)
    // =========================
    function drawLayer2(midX, midY) {
      const baseR  = Math.min(canvas.width, canvas.height) * 0.15;
      const outerR = baseR + 80;
      const half = outerR;

      const count = borderCountForLevel(squareLevel);
      const mark = markForLevel(squareLevel);

      const transforms = mirroringOn ? mirrors : [[1, 1]];

      for (const [sx, sy] of transforms) {
        ctx.save();
        ctx.translate(midX, midY);
        ctx.scale(sx, sy);

        ctx.beginPath();
        ctx.rect(0, -half, half, half);
        ctx.clip();

        drawLBorder(half, count);
        if (mark) drawMarkNearCorner(half, mark);

        ctx.restore();
      }
    }

    // =========================
    // LAYER 1 (ON TOP)
    // Outer circle constant; inner circle+marker+roman only when value>0
    // =========================
    function drawLayer1(midX, midY) {
      const innerR = Math.min(canvas.width, canvas.height) * 0.35;
      const outerR = innerR + 80;

      const start = -Math.PI / 2;
      const end   = 0;
      const midAngle = (start + end) / 2;

      const ringWidth = 3;
      const markerOuterR = 40;
      const markerStroke = 3;

      const transforms = mirroringOn ? mirrors : [[1, 1]];

      for (const [sx, sy] of transforms) {
        ctx.save();
        ctx.translate(midX, midY);
        ctx.scale(sx, sy);

        // outer circle always
        strokeArc(outerR, ringWidth, "red", start, end);

        if (value > 0) {
          strokeArc(innerR, ringWidth, "red", start, end);

          const markerX = Math.cos(midAngle) * innerR;
          const markerY = Math.sin(midAngle) * innerR;

          eraseCircle(markerX, markerY, markerOuterR + 3);
          drawHollowMarker(markerX, markerY, markerOuterR, markerStroke, "red");
          drawText(toRoman(value) || "—", markerX, markerY, 30, "white");
        }

        ctx.restore();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const midX = canvas.width / 2;
      const midY = canvas.height / 2;

      drawLayer2(midX, midY);
      drawQuadrantLines(midX, midY);
      drawLayer1(midX, midY);
    }

    // ---------- UI wiring ----------
    toggleMirrorBtn.addEventListener("click", () => {
      mirroringOn = !mirroringOn;
      toggleMirrorBtn.textContent = `Mirroring: ${mirroringOn ? "ON" : "OFF"}`;
      mirrorStatusEl.textContent = mirroringOn ? "Drawing 4 quadrants" : "Drawing top-right only";
      draw();
    });

    minusRomanBtn.addEventListener("click", () => {
      value = Math.max(0, value - 1);
      updateRomanUI();
    });
    plusRomanBtn.addEventListener("click", () => {
      value = Math.min(3999, value + 1);
      updateRomanUI();
    });

    minusSquareBtn.addEventListener("click", () => {
      squareLevel = Math.max(0, squareLevel - 1);
      updateSquareUI();
    });
    plusSquareBtn.addEventListener("click", () => {
      squareLevel = Math.min(10, squareLevel + 1);
      updateSquareUI();
    });

    window.addEventListener("resize", resize);
    resize();
    updateRomanUI();
    updateSquareUI();
  </script>
</body>
</html>
